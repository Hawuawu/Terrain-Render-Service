name: GHCR cleanup
# Keeps registry storage bounded: drop a PR's `pr-N` image when the PR closes, and weekly sweep
# untagged, orphaned and ghost multi-arch versions. Release tags and `edge` are never matched.
# pull_request_target (no checkout, no PR code runs) still fires for PRs closed with merge conflicts.
on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pr-image:
    name: Delete pr-${{ github.event.pull_request.number }} image
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
    # Same group as the PR's image build: cancels a build still running so it cannot publish after this deletion.
    concurrency:
      group: image-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          package: terrain-render-service
          delete-tags: pr-${{ github.event.pull_request.number }}
          delete-untagged: true
  sweep:
    name: Sweep untagged versions
    if: github.event_name != 'pull_request_target'
    concurrency:
      group: ghcr-sweep
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          package: terrain-render-service
          delete-untagged: true
          delete-orphaned-images: true
          delete-ghost-images: true
          older-than: 7 days
