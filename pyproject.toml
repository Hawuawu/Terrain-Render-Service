[project]
name = "terrain-render-service"
version = "0.1.0"
description = "Cesium terrain tiles and MCP tools over the Copernicus DEM, served on demand"
authors = [
    { name = "Devin AI", email = "158243242+devin-ai-integration[bot]@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "fastmcp>=4.2.5",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.3",
    "pydelatin>=0.4.0",
    "quantized-mesh-encoder>=0.5.0",
    "rasterio>=1.5.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["CPY001", "COM812", "D203", "D213", "TC001", "TC002", "TC003", "EM101", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "PLR2004", "INP001", "SLF001"]
"src/terrain_render_service/api.py" = ["D103", "B008"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pydelatin.*", "rasterio.*", "affine.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=terrain_render_service --cov-report=term-missing --cov-fail-under=90"
markers = ["network: reads the real Copernicus DEM from AWS (deselect with -m 'not network')"]
asyncio_mode = "auto"
